name: CI/CD Pipeline - Blood Donor App

on:
  push:
    branches:
      - main

env:
  DOCKERHUB_USERNAME: khrisblurp
  BACKEND_IMAGE: blood-app-backend
  FRONTEND_IMAGE: blood-app-frontend

jobs:
  build-test-push-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Setup Docker Build
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. Login to DockerHub
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 4. Build Backend Image
    - name: Build Backend Image
      run: |
        docker build -t $DOCKERHUB_USERNAME/$BACKEND_IMAGE:${{ github.sha }} ./Backend
        docker tag $DOCKERHUB_USERNAME/$BACKEND_IMAGE:${{ github.sha }} $DOCKERHUB_USERNAME/$BACKEND_IMAGE:latest

    # 5. Build Frontend Image
    - name: Build Frontend Image
      run: |
        docker build -t $DOCKERHUB_USERNAME/$FRONTEND_IMAGE:${{ github.sha }} ./Frontend
        docker tag $DOCKERHUB_USERNAME/$FRONTEND_IMAGE:${{ github.sha }} $DOCKERHUB_USERNAME/$FRONTEND_IMAGE:latest

    # 6. Push Backend Image
    - name: Push Backend Image
      run: |
        docker push $DOCKERHUB_USERNAME/$BACKEND_IMAGE:${{ github.sha }}
        docker push $DOCKERHUB_USERNAME/$BACKEND_IMAGE:latest

    # 7. Push Frontend Image
    - name: Push Frontend Image
      run: |
        docker push $DOCKERHUB_USERNAME/$FRONTEND_IMAGE:${{ github.sha }}
        docker push $DOCKERHUB_USERNAME/$FRONTEND_IMAGE:latest

    # 8. Setup kubectl
    - name: Setup kubectl
      uses: azure/setup-kubectl@v4

    # 9. Configure Kubeconfig
    - name: Set Kubeconfig
      run: |
        echo "${{ secrets.KUBE_CONFIG }}" > kubeconfig
        export KUBECONFIG=kubeconfig

    # 10. Deploy with Helm
    - name: Helm Deploy
      run: |
        helm upgrade --install blood-app ./Helm \
          --set backend.image.repository=$DOCKERHUB_USERNAME/$BACKEND_IMAGE \
          --set backend.image.tag=${{ github.sha }} \
          --set frontend.image.repository=$DOCKERHUB_USERNAME/$FRONTEND_IMAGE \
          --set frontend.image.tag=${{ github.sha }}