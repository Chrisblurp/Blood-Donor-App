apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-migrate"
  annotations:
    "helm.sh/hook": "post-install,post-upgrade"           # ← uncommented
    "helm.sh/hook-delete-policy": "before-hook-creation"  # ← quotes fixed
    "helm.sh/hook-weight": "0"                            # optional, good practice
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never

      initContainers:
        - name: wait-for-db
          image: busybox
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for postgres...";
                sleep 2;
              done

      containers:
        - name: migrate
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: Always
          command: ["python", "manage.py", "migrate"]
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret